<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Check if URL matches /deep-link/* and redirect to fallback.html
        const urlPath = window.location.pathname;

        if (urlPath.startsWith('/deep-link')) {
            // Redirect to fallback page
            window.location.href = '/fallback.html';
        }
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
    <p>If the app is not installed, you will be redirected to the App Store.</p>
</body>
</html>
