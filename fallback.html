<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Get the current URL (this will be the Universal Link path)
        const universalLink = window.location.href;  // e.g., "https://anymindg.github.io/deep-link/home"
        
        // App Store URL (change to your app's App Store page URL)
        const appStoreURL = 'https://apps.apple.com/app/511154461'; 
        
        // Try to open the app using the Universal Link
        function tryOpenApp() {
            // Use an iframe to try to open the Universal Link
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = universalLink;
            document.body.appendChild(iframe);

            // If the app doesn't open within a set time, redirect to the App Store
            setTimeout(() => {
                window.location.href = appStoreURL;  // Redirect to App Store if the app isn't installed
            }, 2000);
        }

        // Start the attempt to open the app when the page loads
        window.onload = tryOpenApp;
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
    <p>If the app doesn't open, you'll be redirected to the App Store.</p>
</body>
</html>
